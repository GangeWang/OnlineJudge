version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: onlineoj-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST_BACKEND_DIR=${HOST_BACKEND_DIR:-${PWD}/backend}
      - MARIADB_HOST=host.docker.internal
      - MARIADB_PORT=3306
      - MARIADB_USER=onlinejudge
      - MARIADB_PASSWORD=onlinejudge
      - MARIADB_DATABASE=onlinejudge
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./backend:/app
    depends_on:
      - docker-socket-proxy

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      INFO: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  sandbox:
    build:
      context: ./sandbox
    image: onlineoj-sandbox:latest